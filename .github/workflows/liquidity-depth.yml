name: Liquidity Depth Feature

on:
  pull_request:
    paths:
      - 'frontend/src/server/research/liquidity-depth/**'
      - 'frontend/src/app/api/insights/liquidity-depth/**'
      - 'frontend/src/components/research/liquidity-depth/**'
      - 'frontend/src/app/insights/liquidity-depth/**'
      - 'frontend/tests/features/liquidity-depth/**'
      - '.github/workflows/liquidity-depth.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/src/server/research/liquidity-depth/**'
      - 'frontend/src/app/api/insights/liquidity-depth/**'
      - 'frontend/src/components/research/liquidity-depth/**'
      - 'frontend/src/app/insights/liquidity-depth/**'
      - 'frontend/tests/features/liquidity-depth/**'
      - '.github/workflows/liquidity-depth.yml'

jobs:
  test-and-lint:
    name: Liquidity Depth Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: |
          cd frontend
          npx eslint src/server/research/liquidity-depth src/app/api/insights/liquidity-depth src/components/research/liquidity-depth src/app/insights/liquidity-depth tests/features/liquidity-depth

      - name: Run Tests
        run: |
          cd frontend
          npx vitest run tests/features/liquidity-depth
