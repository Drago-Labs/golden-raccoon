name: Feature - reserve planner

on:
  pull_request:
    paths:
      - "frontend/src/server/research/reserve-planner/**"
      - "frontend/src/components/research/reserve-planner/**"
      - "frontend/src/app/api/insights/reserve-planner/**"
      - "frontend/src/app/insights/reserve-planner/**"
      - "frontend/tests/features/reserve-planner/**"
      - "frontend/e2e/specs/reserve-planner.spec.ts"
      - "docs/features/reserve-planner.md"
      - ".github/workflows/feature-reserve-planner.yml"
  workflow_dispatch:

jobs:
  focused-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/features/reserve-planner
      - run: npx tsc --noEmit --project tests/features/reserve-planner/tsconfig.json
      - run: npx eslint src/server/research/reserve-planner src/components/research/reserve-planner src/app/api/insights/reserve-planner src/app/insights/reserve-planner tests/features/reserve-planner e2e/specs/reserve-planner.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: PORT=3018 NEXT_PUBLIC_APP_URL=http://localhost:3018 npx playwright test e2e/specs/reserve-planner.spec.ts --project=chromium-desktop --project=chromium-mobile
