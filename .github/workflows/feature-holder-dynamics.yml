name: Holder dynamics feature
on:
  pull_request:
    paths:
      - "frontend/src/server/research/holder-dynamics/**"
      - "frontend/src/components/research/holder-dynamics/**"
      - "frontend/tests/features/holder-dynamics/**"
      - "frontend/src/app/api/insights/holder-dynamics/**"
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/holder-dynamics
      - run: npx eslint src/server/research/holder-dynamics src/components/research/holder-dynamics tests/features/holder-dynamics
