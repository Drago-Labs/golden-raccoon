name: Feature - claimable balances
on:
  pull_request:
    paths: ["frontend/src/server/research/claimable-balances/**", "frontend/src/components/research/claimable-balances/**", "frontend/src/app/api/insights/claimable-balances/**", "frontend/src/app/insights/claimable-balances/**", "frontend/tests/features/claimable-balances/**", "frontend/e2e/specs/claimable-balances.spec.ts", "docs/features/claimable-balances.md", ".github/workflows/feature-claimable-balances.yml"]
  workflow_dispatch:
jobs:
  focused-suite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/claimable-balances
      - run: npx tsc --noEmit --project tests/features/claimable-balances/tsconfig.json
      - run: npx eslint src/server/research/claimable-balances src/components/research/claimable-balances src/app/api/insights/claimable-balances src/app/insights/claimable-balances tests/features/claimable-balances e2e/specs/claimable-balances.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: PORT=3019 NEXT_PUBLIC_APP_URL=http://localhost:3019 npx playwright test e2e/specs/claimable-balances.spec.ts --project=chromium-desktop --project=chromium-mobile
