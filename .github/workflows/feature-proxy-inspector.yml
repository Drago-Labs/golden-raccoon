name: Proxy inspector feature
on:
  pull_request:
    paths: ["frontend/src/server/research/proxy-inspector/**", "frontend/src/components/research/proxy-inspector/**", "frontend/tests/features/proxy-inspector/**"]
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/proxy-inspector
      - run: npx eslint src/server/research/proxy-inspector src/components/research/proxy-inspector tests/features/proxy-inspector
