name: Command palette
on:
  pull_request:
    paths: ["frontend/src/lib/commandPalette/**", "frontend/src/components/commandPalette/**", "frontend/src/components/AppShell.tsx", "frontend/tests/features/command-palette/**", ".github/workflows/feature-command-palette.yml"]
  push:
    branches: [main]
    paths: ["frontend/src/lib/commandPalette/**", "frontend/src/components/commandPalette/**"]
permissions:
  contents: read
jobs:
  feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx vitest run --config tests/features/command-palette/vitest.config.mts
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend
      - run: npx playwright test --config tests/features/command-palette/playwright.config.ts
        working-directory: frontend
