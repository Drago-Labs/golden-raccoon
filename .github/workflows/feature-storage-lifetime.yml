name: Storage lifetime feature

on:
  pull_request:
    paths:
      - "frontend/src/server/research/storage-lifetime/**"
      - "frontend/src/components/research/storage-lifetime/**"
      - "frontend/src/app/api/insights/storage-lifetime/**"
      - "frontend/src/app/insights/storage-lifetime/**"
      - "frontend/tests/features/storage-lifetime/**"
      - "frontend/e2e/specs/storage-lifetime.spec.ts"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run tests/features/storage-lifetime
      - run: npx eslint src/server/research/storage-lifetime src/components/research/storage-lifetime src/app/api/insights/storage-lifetime src/app/insights/storage-lifetime tests/features/storage-lifetime
