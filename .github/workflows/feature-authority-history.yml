name: Feature · authority history

on:
  pull_request:
    paths:
      - "frontend/src/server/research/authority-history/**"
      - "frontend/src/components/research/authority-history/**"
      - "frontend/src/app/insights/authority-history/**"
      - "frontend/src/app/api/insights/authority-history/**"
      - "frontend/tests/features/authority-history/**"
      - ".github/workflows/feature-authority-history.yml"
  push:
    branches: [main]

concurrency:
  group: feature-authority-history-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  focused-suite:
    name: authority-history focused suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused suite
        working-directory: frontend
        run: npx vitest run tests/features/authority-history

      - name: Lint feature paths
        working-directory: frontend
        run: npx eslint src/server/research/authority-history src/components/research/authority-history src/app/api/insights/authority-history src/app/insights/authority-history tests/features/authority-history
