name: Alert rule lab feature
on:
  pull_request:
    paths: ["frontend/src/server/research/alert-rule-lab/**", "frontend/src/components/research/alert-rule-lab/**", "frontend/tests/features/alert-rule-lab/**"]
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/alert-rule-lab
      - run: npx eslint src/server/research/alert-rule-lab src/components/research/alert-rule-lab tests/features/alert-rule-lab
