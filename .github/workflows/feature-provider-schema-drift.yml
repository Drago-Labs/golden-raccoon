name: Feature · provider schema drift

on:
  pull_request:
    paths:
      - "frontend/src/server/research/provider-schema-drift/**"
      - "frontend/src/components/research/provider-schema-drift/**"
      - "frontend/src/app/insights/provider-schema-drift/**"
      - "frontend/src/app/api/ops/provider-schema-drift/**"
      - "frontend/tests/features/provider-schema-drift/**"
      - ".github/workflows/feature-provider-schema-drift.yml"
  push:
    branches: [main]

concurrency:
  group: feature-provider-schema-drift-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  focused-suite:
    name: provider-schema-drift focused suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - working-directory: frontend
        run: npx vitest run tests/features/provider-schema-drift
