name: Peg Observations Feature CI

on:
  pull_request:
    paths:
      - "frontend/src/server/research/peg-observations/**"
      - "frontend/src/components/research/peg-observations/**"
      - "frontend/src/app/insights/peg-observations/**"
      - "frontend/src/app/api/insights/peg-observations/**"
      - "frontend/tests/features/peg-observations/**"
      - "docs/PEG_DEVIATION_OBSERVATIONS.md"
  push:
    branches: [main]
    paths:
      - "frontend/src/server/research/peg-observations/**"
      - "frontend/src/components/research/peg-observations/**"
      - "frontend/src/app/insights/peg-observations/**"
      - "frontend/src/app/api/insights/peg-observations/**"
      - "frontend/tests/features/peg-observations/**"
      - "docs/PEG_DEVIATION_OBSERVATIONS.md"

concurrency:
  group: peg-observations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  peg-observations-verification:
    name: Peg observations feature suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Targeted ESLint check
        run: |
          cd frontend
          npx eslint src/server/research/peg-observations src/components/research/peg-observations src/app/api/insights/peg-observations tests/features/peg-observations

      - name: Run feature test suite
        run: npm run test:peg-observations

      - name: Run accessibility check
        run: npm --prefix frontend run test:a11y
