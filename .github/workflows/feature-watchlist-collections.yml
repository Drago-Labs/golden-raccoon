name: Feature · watchlist collections

on:
  pull_request:
    paths:
      - "frontend/src/server/research/watchlist-collections/**"
      - "frontend/src/components/research/watchlist-collections/**"
      - "frontend/src/app/insights/watchlist-collections/**"
      - "frontend/src/app/api/insights/watchlist-collections/**"
      - "frontend/src/server/storage/migrations/20260912_watchlist_collections*.sql"
      - "frontend/tests/features/watchlist-collections/**"
      - ".github/workflows/feature-watchlist-collections.yml"
  push:
    branches: [main]

concurrency:
  group: feature-watchlist-collections-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  focused-suite:
    name: watchlist-collections focused suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused suite
        working-directory: frontend
        run: npx vitest run tests/features/watchlist-collections

  migration:
    name: apply and roll back the feature migration
    runs-on: ubuntu-latest

    # A disposable database, created and destroyed with the job. The migration
    # is applied, validated, rolled back and applied again, so both directions
    # are exercised against real PostgreSQL rather than against a fake.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collections_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PSQL: psql -h localhost -U postgres -d collections_migration_check -v ON_ERROR_STOP=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the watchlist table this feature sits beside
        run: $PSQL -c "create table if not exists watchlist_entries (id text primary key);"

      - name: Apply the migration
        run: $PSQL -f frontend/src/server/storage/migrations/20260912_watchlist_collections.sql

      - name: Validate it
        run: $PSQL -f frontend/src/server/storage/migrations/20260912_watchlist_collections.validate.sql

      - name: Apply it again, to prove it is repeatable
        run: $PSQL -f frontend/src/server/storage/migrations/20260912_watchlist_collections.sql

      - name: Roll it back
        run: $PSQL -f frontend/src/server/storage/migrations/20260912_watchlist_collections.rollback.sql

      - name: Confirm the rollback left the watchlist alone
        run: $PSQL -c "select 1 from watchlist_entries limit 1;"
