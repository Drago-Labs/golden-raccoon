name: Feature · balance reconciliation

on:
  pull_request:
    paths:
      - "frontend/src/server/research/balance-reconciliation/**"
      - "frontend/src/components/research/balance-reconciliation/**"
      - "frontend/src/app/insights/balance-reconciliation/**"
      - "frontend/src/app/api/insights/balance-reconciliation/**"
      - "frontend/tests/features/balance-reconciliation/**"
      - "docs/features/balance-reconciliation.md"
      - "docs/features/balance-reconciliation-evidence.md"
      - "docs/features/balance-reconciliation-api.md"
      - ".github/workflows/feature-balance-reconciliation.yml"
  workflow_dispatch:

concurrency:
  group: feature-balance-reconciliation-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  focused-suite:
    name: balance-reconciliation focused suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run focused suite
        run: npx vitest run tests/features/balance-reconciliation

      - name: Typecheck focused modules
        run: npx tsc --noEmit --project tests/features/balance-reconciliation/tsconfig.json

      - name: Lint focused paths
        run: npx eslint src/server/research/balance-reconciliation src/components/research/balance-reconciliation src/app/api/insights/balance-reconciliation src/app/insights/balance-reconciliation tests/features/balance-reconciliation
