name: Feature - account signers
on:
  pull_request:
    paths:
      [
        "frontend/src/server/research/account-signers/**",
        "frontend/src/components/research/account-signers/**",
        "frontend/src/app/api/insights/account-signers/**",
        "frontend/src/app/insights/account-signers/**",
        "frontend/tests/features/account-signers/**",
        "frontend/e2e/specs/account-signers.spec.ts",
        "docs/features/account-signers.md",
        ".github/workflows/feature-account-signers.yml",
      ]
  workflow_dispatch:
jobs:
  focused-suite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/account-signers
      - run: npx tsc --noEmit --project tests/features/account-signers/tsconfig.json
      - run: npx eslint src/server/research/account-signers src/components/research/account-signers src/app/api/insights/account-signers src/app/insights/account-signers tests/features/account-signers e2e/specs/account-signers.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: PORT=3022 NEXT_PUBLIC_APP_URL=http://localhost:3022 npx playwright test e2e/specs/account-signers.spec.ts --project=chromium-desktop --project=chromium-mobile
