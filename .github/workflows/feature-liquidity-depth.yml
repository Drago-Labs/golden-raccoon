name: Feature · liquidity depth

on:
  pull_request:
    paths:
      - "frontend/src/server/research/liquidity-depth/**"
      - "frontend/src/components/research/liquidity-depth/**"
      - "frontend/src/app/insights/liquidity-depth/**"
      - "frontend/src/app/api/insights/liquidity-depth/**"
      - "frontend/tests/features/liquidity-depth/**"
      - ".github/workflows/feature-liquidity-depth.yml"
  push:
    branches: [main]

concurrency:
  group: feature-liquidity-depth-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  focused-suite:
    name: liquidity-depth focused suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused suite
        working-directory: frontend
        run: npx vitest run tests/features/liquidity-depth
