[workspace]
resolver = "2"
members = [
  "contracts/risk-registry",
  "contracts/policy",
  "contracts/vault",
  "contracts/audit-registry",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
# Pinned for reproducible WASM provenance (must match CI / BUILD_PROVENANCE.md).
soroban-sdk = "=27.0.6"

# CI and scripts/build-soroban.sh use `stellar contract build` → wasm32v1-none.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
